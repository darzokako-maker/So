name: Android Build (No Wrapper)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradlew olmadığı için sistem genelinde Gradle kuruyoruz
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      # Gradlew yerine doğrudan 'gradle' komutuyla derleme
      - name: Build with System Gradle
        run: |
          # build.gradle dosyasını bul ve o klasöre gir
          BUILD_FILE=$(find . -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "HATA: build.gradle bulunamadı!"
            exit 1
          fi
          cd $(dirname "$BUILD_FILE")
          gradle assembleDebug

      # Tüm .so ve .apk dosyalarını yakala
      - name: Collect and Upload
        run: |
          mkdir -p output_files
          find . -name "*.so" -exec cp {} ./output_files/ \;
          find . -name "*.apk" -exec cp {} ./output_files/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Final_Build_Result
          path: output_files/
          
