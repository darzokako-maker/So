name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Hata veren cache kısmını sildik

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Build with Gradle
        run: |
          # Eğer dosyaların bir klasör içindeyse o klasöre girmesi için:
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            find . -name "gradlew" -exec chmod +x {} \;
            find . -name "gradlew" -execdir ./gradlew assembleDebug \;
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: "**/*.apk" # Tüm alt klasörlerdeki APK'ları bulur
          
