name: Build SO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup NDK
        uses: n0rt3n/setup-ndk@v1
        with:
          ndk-version: r25c
      - name: Compile
        run: cd jni && ndk-build
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: VIP_Menu
          path: libs/arm64-v8a/libBlockForceMenu.so
          
