name: BlockForce_Menu_Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v3

      - name: NDK Kurulumu (r25c)
        uses: n0rt3n/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Derleme Islemi
        run: |
          cd jni
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a

      - name: Dosyayi Yukle (Artifact)
        uses: actions/upload-artifact@v3
        with:
          name: BlockForce_Menu_Output
          path: jni/libs/arm64-v8a/libBlockForceMenu.so
          
