name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # NDK Kurulumu (Manuel yöntem - Hata riskini sıfıra indirir)
      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Build with Gradle
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            find . -name "gradlew" -exec chmod +x {} \;
            find . -name "gradlew" -execdir ./gradlew assembleDebug \;
          fi

      # Hem APK hem de .so kütüphanelerini toplayan son adım
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build_Output_Files
          path: |
            **/*.apk
            **/*.so
            **/build/intermediates/cmake/**/*.so
            **/build/intermediates/merged_native_libs/**/*.so
            
